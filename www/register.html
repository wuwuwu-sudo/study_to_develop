<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>顾客注册 - 美食订餐系统</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <h1>顾客注册</h1>
            <form id="registerForm" action="/api/user/register" method="POST">
                <div class="form-group">
                    <label for="username">用户名</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <div class="form-group">
                    <label for="confirm">确认密码</label>
                    <input type="password" id="confirm" name="confirm" required>
                </div>
                <div id="errorMsg" class="error-msg hidden"></div>
                <button type="submit" class="btn btn-primary btn-full">注册</button>
            </form>
            <p class="auth-link">已有账号？<a href="/login.html">立即登录</a></p>
            <p class="auth-link"><a href="/">返回首页</a></p>
        </div>
    </div>
    <script>
    document.getElementById('registerForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const pw = document.getElementById('password').value;
        const cf = document.getElementById('confirm').value;

        /* ---------- 1. 前端校验（保留） ---------- */
        if (pw !== cf) {
            document.getElementById('errorMsg').textContent = '两次密码不一致';
            document.getElementById('errorMsg').classList.remove('hidden');
            return;
        }

        /* ---------- 2. 组装 JSON ---------- */
        const fd = new FormData(this);
        const data = {
            username: fd.get('username'),
            password: fd.get('password'),
            confirm: fd.get('confirm'),
            shop_name: fd.get('shop_name'),   // 商家注册才有
            address: fd.get('address')        // 商家注册才有
        };

        try {
            /* ---------- 3. 发送 JSON ---------- */
            const resp = await fetch(this.action, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json; charset=utf-8'
                },
                body: JSON.stringify(data),
                redirect: 'manual'
            });

            /* ---------- 4. 处理 3xx 重定向 ---------- */
            if (resp.status >= 300 && resp.status < 400) {
                window.location.href = resp.headers.get('Location');
                return;
            }

            /* ---------- 5. 注册失败 ---------- */
            const result = await resp.json();
            document.getElementById('errorMsg').textContent =
                result.message || '注册失败';
            document.getElementById('errorMsg').classList.remove('hidden');

        } catch (err) {
            document.getElementById('errorMsg').textContent = '网络错误';
            document.getElementById('errorMsg').classList.remove('hidden');
        }
    });
    </script>
</body>
</html>
